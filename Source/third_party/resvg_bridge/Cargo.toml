[package]
name = "vove-resvg-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
resvg = { version = "=0.48.1", default-features = false, features = [
    "memmap-fonts",
    "raster-images",
    "system-fonts",
    "text",
] }

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false
panic = "abort"
